[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"


[tool.setuptools_scm]
version_file = "src/nrsur_catalog/_version.py"

[tool.semantic_release]
version_variable = "src/nrsur_catalog/_version.py:__version__"
version_source = "commit"
commit_version_number = true
commit_subject = "chore(release): {version}"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
no_local_version = true


[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.rst"

[project]
name = "nrsur_catalog"
dynamic = ["version"]  # scm versioning (using tags)
requires-python = ">=3.8"
description = "GW event posteriors obtained using numerical relativity surrogate models."
readme = "README.md"
license = { text = "" }
authors = [
    { name = "Avi Vajpeyi", email = "avi.vajpeyi@gmail.com" },  # Extracted dynamically
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "matplotlib",
    "loguru",
    "bilby[gw]",
]

[project.optional-dependencies]
dev = [
    "jupyter-book>=0.13.2",
    "ploomber-engine>=0.0.23",
    "tabulate",
    "jupytext",
    "ghp-import",
    "sphinx_inline_tabs",
    "pytest",
    "GitPython",
    "sphinx-inline-tabs",
    "sphinxcontrib-bibtex",
    "plotly",
    "papermill",
    "nbconvert",
    "itables",
    "pytest-mock",
]

[project.urls]
"Homepage" = "https://nrsur-catalog.github.io/NRSurCat-1"
"Bug Reports" = "https://giuthub.com/nrsur-catalog/nrsur_catalog/issues"
"Source" = "https://giuthub.com/nrsur-catalog/nrsur_catalog"


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
nrsur_catalog = [
    "api/lvk_urls.txt",
    "api/nrsur_urls.txt",
    "style.mplstyle",
]

[project.scripts]
get_nrsur_event = "nrsur_catalog.api.download_event:main"



